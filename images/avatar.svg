<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leaf with chemical compound">
	<defs>
		<radialGradient id="bg" cx="40%" cy="38%" r="75%">
			<stop offset="0%" stop-color="#f5f2eb"/>
			<stop offset="100%" stop-color="#d9d3c4"/>
		</radialGradient>
		<linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#7a9a64"/>
			<stop offset="100%" stop-color="#4f6e3e"/>
		</linearGradient>
	</defs>

	<!-- Circular canvas -->
	<circle cx="100" cy="100" r="100" fill="url(#bg)"/>

	<!-- Stylized leaf occupying the lower-right -->
	<g>
		<path d="M 60 168
		         C 50 130, 65 95, 100 78
		         C 138 62, 162 82, 158 118
		         C 154 152, 118 178, 60 168 Z"
		      fill="url(#leafGrad)"
		      stroke="#33522a"
		      stroke-width="2"
		      stroke-linejoin="round"/>

		<!-- Main vein -->
		<path d="M 60 168 Q 105 132, 155 86"
		      stroke="#2e4724"
		      stroke-width="2.2"
		      fill="none"
		      stroke-linecap="round"/>

		<!-- Side veins -->
		<path d="M 86 155 Q 88 142, 78 130" stroke="#2e4724" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
		<path d="M 108 138 Q 104 124, 92 116" stroke="#2e4724" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
		<path d="M 128 121 Q 122 108, 110 102" stroke="#2e4724" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
		<path d="M 144 105 Q 138 94, 128 90" stroke="#2e4724" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8"/>
	</g>

	<!-- Benzene ring (chemical compound) in upper-left -->
	<g transform="translate(46, 36)">
		<!-- Hexagon outline -->
		<polygon points="22,0 41,11 41,33 22,44 3,33 3,11"
		         fill="#faf7ef"
		         stroke="#c4632b"
		         stroke-width="3"
		         stroke-linejoin="round"/>

		<!-- Three inner double-bond lines (aromatic) -->
		<line x1="9"  y1="14" x2="9"  y2="30" stroke="#c4632b" stroke-width="2"/>
		<line x1="35" y1="14" x2="35" y2="30" stroke="#c4632b" stroke-width="2"/>
		<line x1="14" y1="6"  x2="30" y2="6"  stroke="#c4632b" stroke-width="2"/>

		<!-- Hydroxyl group -OH at top-right vertex -->
		<line x1="41" y1="11" x2="52" y2="4" stroke="#c4632b" stroke-width="2.5" stroke-linecap="round"/>
		<text x="62" y="8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#c4632b" text-anchor="middle">OH</text>

		<!-- Methyl group -CH3 at bottom-left vertex -->
		<line x1="3" y1="33" x2="-9" y2="40" stroke="#c4632b" stroke-width="2.5" stroke-linecap="round"/>
		<text x="-18" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c4632b" text-anchor="middle">CH₃</text>
	</g>

	<!-- Subtle "emission" line connecting leaf and molecule (suggests biosynthesis) -->
	<path d="M 92 92 Q 84 78, 78 70"
	      stroke="#c4632b"
	      stroke-width="1.5"
	      stroke-dasharray="2 3"
	      fill="none"
	      opacity="0.55"
	      stroke-linecap="round"/>
</svg>
